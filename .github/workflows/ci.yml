name: Tests and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install package and development tools
        run: python -m pip install ".[dev]"
      - name: Python regression tests
        run: python -m pytest -q
      - name: Offline editor interaction tests
        run: |
          python tests/create_editor_fixture.py .test-output/editor.html
          node tests/editor_interactions.cjs .test-output/editor.html
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check installed command away from the checkout
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          subocr --version
          subocr --json doctor
